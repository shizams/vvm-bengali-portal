<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>শিক্ষার্থী বিজ্ঞান মন্থন (VVM) - বাংলা মাধ্যম পোর্টাল | পশ্চিমবঙ্গ বোর্ড (Created by Siraj Hossain)</title>
  <meta name="description" content="পশ্চিমবঙ্গ মধ্যশিক্ষা (WBBSE) ও উচ্চমাধ্যমিক (WBCHSE) পর্ষদের শিক্ষার্থী বিজ্ঞান মন্থন (VVM) বিগত ১০ বছরের প্রশ্ন-উত্তর, শ্রেণি ৬-১১ সংকলন ও মক টেস্ট পোর্টাল। Created by Siraj Hossain.">
  <meta name="author" content="Siraj Hossain">

  <!-- PWA & Android Meta Tags -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#050816">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="VVM বাংলা">

  <!-- Google Fonts: Bengali & Formal Sci-Fi Telemetry -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@500;600;700;800&family=Orbitron:wght@600;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       Formal Sci-Fi Design System & Bengali Typography
       Created by Siraj Hossain
       ========================================================================== */
    :root {
      --bg-space: #050816;
      --bg-surface: rgba(15, 23, 42, 0.88);
      --bg-surface-card: rgba(26, 38, 66, 0.75);
      --bg-subtle: rgba(255, 255, 255, 0.06);
      
      --border-neon-cyan: rgba(56, 189, 248, 0.35);
      --border-neon-purple: rgba(168, 85, 247, 0.35);
      --border-subtle: rgba(255, 255, 255, 0.12);
      
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-cyan: #38bdf8;
      --text-purple: #c084fc;
      --text-amber: #fde047;
      
      --neon-cyan: #38bdf8;
      --neon-purple: #a855f7;
      --neon-emerald: #10b981;
      --neon-rose: #f43f5e;
      --neon-amber: #f59e0b;

      --glow-cyan: 0 0 20px rgba(56, 189, 248, 0.3);
      --glow-purple: 0 0 20px rgba(168, 85, 247, 0.3);

      --font-bengali: 'Hind Siliguri', 'Noto Serif Bengali', sans-serif;
      --font-serif-bn: 'Noto Serif Bengali', serif;
      --font-scifi: 'Orbitron', 'Space Grotesk', sans-serif;
    }

    body.theme-light {
      --bg-space: #f8fafc;
      --bg-surface: rgba(255, 255, 255, 0.94);
      --bg-surface-card: rgba(241, 245, 249, 0.98);
      --bg-subtle: rgba(0, 0, 0, 0.04);
      
      --border-neon-cyan: rgba(14, 165, 233, 0.3);
      --border-neon-purple: rgba(147, 51, 234, 0.3);
      --border-subtle: rgba(0, 0, 0, 0.1);
      
      --text-main: #0f172a;
      --text-muted: #475569;
      --text-cyan: #0284c7;
      --text-purple: #7e22ce;
      --text-amber: #b45309;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      min-height: 100vh;
      font-family: var(--font-bengali);
      background-color: var(--bg-space);
      color: var(--text-main);
      overflow-x: hidden;
      line-height: 1.6;
    }

    #galaxy-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: auto;
    }

    #app {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* Header & Formal HUD */
    .scifi-header {
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      background: rgba(5, 8, 22, 0.88);
      border-bottom: 1px solid var(--border-neon-cyan);
    }

    .hud-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 20px;
      background: rgba(0, 0, 0, 0.5);
      font-family: var(--font-scifi);
      font-size: 0.75rem;
      letter-spacing: 1px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .hud-telemetry {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-cyan);
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background: var(--neon-emerald);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--neon-emerald);
      animation: pulseDot 2s infinite;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(1.3); }
    }

    .hud-sep { color: var(--border-subtle); }
    .hud-highlight { color: var(--neon-amber); font-weight: 700; }

    .hud-user-profile {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hud-user-profile input {
      background: var(--bg-subtle);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      color: var(--text-main);
      font-family: var(--font-bengali);
      font-size: 0.85rem;
      padding: 3px 8px;
      width: 130px;
      outline: none;
    }

    .hud-mini-btn {
      background: var(--bg-subtle);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      border-radius: 6px;
      padding: 3px 10px;
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .hud-mini-btn:hover {
      background: rgba(56, 189, 248, 0.25);
      border-color: var(--neon-cyan);
    }

    /* Main Navbar */
    .main-navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .scifi-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .logo-orb {
      font-size: 1.8rem;
      filter: drop-shadow(0 0 10px var(--neon-cyan));
    }

    .logo-main {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .logo-sub {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .badge-class {
      background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
      color: #050816;
      font-weight: 700;
      padding: 1px 8px;
      border-radius: 12px;
      font-size: 0.72rem;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .nav-link {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: 8px;
      font-family: var(--font-bengali);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .nav-link:hover {
      color: var(--text-cyan);
      background: rgba(56, 189, 248, 0.12);
      border-color: var(--border-neon-cyan);
    }

    .nav-link.active {
      color: #ffffff;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.25), rgba(168, 85, 247, 0.25));
      border-color: var(--neon-cyan);
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.3);
    }

    /* Galaxy Hero & Telemetry */
    .galaxy-cover-section {
      padding: 24px 0 60px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .telemetry-box {
      background: var(--bg-surface);
      border: 1px solid var(--border-neon-cyan);
      border-radius: 14px;
      padding: 16px 20px;
      backdrop-filter: blur(12px);
      box-shadow: var(--glow-cyan);
    }

    .hud-box-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-scifi);
      font-size: 0.8rem;
      color: var(--text-cyan);
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 8px;
      margin-bottom: 12px;
    }

    .hud-stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 14px;
    }

    .hud-stat-cell {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 8px 12px;
    }

    .cell-lbl {
      display: block;
      font-family: var(--font-scifi);
      font-size: 0.68rem;
      color: var(--text-muted);
    }

    .cell-val {
      font-family: var(--font-scifi);
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-cyan);
    }

    .cell-val.highlight { color: var(--neon-amber); }

    .hud-controls-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .hud-action-btn {
      background: var(--bg-subtle);
      border: 1px solid var(--border-neon-cyan);
      color: var(--text-cyan);
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .hud-action-btn:hover {
      background: rgba(56, 189, 248, 0.25);
      color: #ffffff;
    }

    .galaxy-hero-content {
      text-align: center;
      padding: 20px 0;
    }

    .hero-author-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(168, 85, 247, 0.15);
      border: 1px solid var(--border-neon-purple);
      border-radius: 24px;
      padding: 6px 18px;
      font-size: 0.95rem;
      color: var(--text-purple);
      margin-bottom: 20px;
      box-shadow: var(--glow-purple);
    }

    .badge-tag {
      background: var(--neon-purple);
      color: #ffffff;
      padding: 1px 8px;
      border-radius: 10px;
      font-size: 0.72rem;
      font-weight: 700;
    }

    .galaxy-hero-title {
      font-size: 2.5rem;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 16px;
    }

    .text-glow {
      background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .galaxy-hero-desc {
      font-size: 1.15rem;
      color: var(--text-muted);
      max-width: 840px;
      margin: 0 auto 30px;
      line-height: 1.7;
    }

    /* Orbital Class Gateways */
    .class-gateways-container { margin: 28px 0; }
    .gateways-header {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-cyan);
      margin-bottom: 14px;
    }

    .class-pills-orbit {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .class-orb-btn {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 10px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: all 0.25s ease;
      min-width: 105px;
    }

    .class-orb-btn:hover {
      border-color: var(--neon-cyan);
      transform: translateY(-3px);
      box-shadow: 0 6px 16px rgba(56, 189, 248, 0.25);
    }

    .class-orb-btn.active {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.3), rgba(168, 85, 247, 0.3));
      border-color: var(--neon-cyan);
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.4);
    }

    .orb-num {
      font-family: var(--font-scifi);
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--neon-cyan);
    }

    .orb-name {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .orb-grp {
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    /* Primary CTAs */
    .hero-actions-hub {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
      margin: 32px 0;
    }

    .btn-scifi-primary,
    .btn-scifi-secondary,
    .btn-scifi-accent {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      padding: 14px 26px;
      border-radius: 14px;
      font-family: var(--font-bengali);
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: left;
      border: none;
    }

    .btn-scifi-primary {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #ffffff;
      box-shadow: 0 4px 20px rgba(37, 99, 235, 0.4);
    }

    .btn-scifi-primary:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 8px 25px rgba(37, 99, 235, 0.6);
    }

    .btn-scifi-secondary {
      background: linear-gradient(135deg, #7c3aed, #9333ea);
      color: #ffffff;
      box-shadow: 0 4px 20px rgba(147, 51, 234, 0.4);
    }

    .btn-scifi-secondary:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 8px 25px rgba(147, 51, 234, 0.6);
    }

    .btn-scifi-accent {
      background: var(--bg-surface);
      border: 1px solid var(--border-neon-cyan);
      color: var(--text-cyan);
    }

    .btn-scifi-accent:hover {
      background: rgba(56, 189, 248, 0.15);
      transform: translateY(-3px);
    }

    .btn-icon { font-size: 1.6rem; }
    .btn-text strong { display: block; font-size: 1.1rem; }
    .btn-text small { font-size: 0.82rem; opacity: 0.85; }

    /* Spotlight Bar */
    .scifi-spotlight-bar {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 14px 20px;
      margin-top: 10px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .spotlight-badge { font-weight: 700; color: var(--neon-amber); font-size: 0.92rem; }
    .spotlight-chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .chip {
      background: var(--bg-subtle);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 3px 12px;
      font-size: 0.85rem;
      color: var(--text-main);
    }

    /* Sections Shared Styling */
    .classes-hub-section,
    .pyq-explorer-section,
    .flashcards-section,
    .scientists-encyclopedia-section,
    .result-analytics-section {
      padding: 30px 20px 60px;
    }

    .section-header-hud {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .hud-tag {
      font-family: var(--font-scifi);
      font-size: 0.72rem;
      letter-spacing: 1.5px;
      color: var(--neon-cyan);
      display: block;
      margin-bottom: 4px;
    }

    .section-title { font-size: 1.8rem; font-weight: 700; margin-bottom: 6px; }
    .section-desc { color: var(--text-muted); font-size: 0.95rem; max-width: 780px; }

    .btn-hud-tool {
      background: var(--bg-surface);
      border: 1px solid var(--border-neon-cyan);
      color: var(--text-cyan);
      padding: 8px 16px;
      border-radius: 10px;
      font-family: var(--font-bengali);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-hud-tool:hover {
      background: rgba(56, 189, 248, 0.2);
      color: #ffffff;
    }

    /* Class Cards Grid */
    .class-cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .class-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 24px;
      transition: all 0.25s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .class-card:hover {
      border-color: var(--border-neon-cyan);
      transform: translateY(-4px);
      box-shadow: var(--glow-cyan);
    }

    .class-card.selected {
      border-color: var(--neon-cyan);
      background: linear-gradient(180deg, rgba(56, 189, 248, 0.12), var(--bg-surface));
    }

    .class-card-top {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 12px;
    }

    .class-badge-lg {
      font-family: var(--font-scifi);
      font-size: 2rem;
      font-weight: 800;
      color: #050816;
      background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
      width: 56px;
      height: 56px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .class-name { font-size: 1.25rem; font-weight: 700; margin-bottom: 2px; }
    .class-group-pill {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 1px 8px;
      border-radius: 10px;
      display: inline-block;
      margin-right: 6px;
    }

    .class-group-pill.junior { background: rgba(56, 189, 248, 0.2); color: var(--neon-cyan); }
    .class-group-pill.senior { background: rgba(168, 85, 247, 0.2); color: var(--neon-purple); }
    .class-board-lbl { font-size: 0.75rem; color: var(--text-muted); }
    .class-desc { font-size: 0.92rem; color: var(--text-muted); margin-bottom: 16px; }

    .class-subjects-list {
      background: rgba(0, 0, 0, 0.25);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 20px;
      font-size: 0.88rem;
    }

    .class-subjects-list strong { color: var(--neon-cyan); display: block; margin-bottom: 6px; }
    .class-subjects-list ul { list-style: none; }
    .class-subjects-list li { margin-bottom: 4px; color: var(--text-main); }

    .class-card-footer { display: flex; gap: 10px; }
    .btn-card-action {
      flex: 1;
      padding: 10px 12px;
      border-radius: 10px;
      font-family: var(--font-bengali);
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      border: 1px solid var(--border-subtle);
      background: var(--bg-subtle);
      color: var(--text-main);
      transition: all 0.2s;
    }

    .btn-card-action:hover {
      border-color: var(--neon-cyan);
      background: rgba(56, 189, 248, 0.2);
      color: #ffffff;
    }

    /* Exam Pattern Card */
    .exam-pattern-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-neon-purple);
      border-radius: 16px;
      padding: 24px;
      margin-top: 20px;
    }

    .pattern-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      color: var(--text-purple);
    }

    .pattern-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .pattern-box {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 16px;
    }

    .pattern-box h4 { color: var(--neon-cyan); margin-bottom: 6px; }
    .pattern-box p { color: var(--neon-amber); font-size: 0.88rem; margin-bottom: 10px; }
    .pattern-box ul { list-style: none; font-size: 0.88rem; color: var(--text-muted); }
    .pattern-box li { margin-bottom: 6px; }

    /* PYQ Matrix */
    .pyq-filter-matrix {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .filter-group label {
      display: block;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-cyan);
      margin-bottom: 8px;
    }

    .filter-pills { display: flex; gap: 8px; }
    .filter-pills.wrap { flex-wrap: wrap; }

    .filter-pill {
      background: var(--bg-subtle);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 20px;
      font-family: var(--font-bengali);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-pill:hover { color: var(--text-main); border-color: var(--neon-cyan); }
    .filter-pill.active {
      background: var(--neon-cyan);
      color: #050816;
      font-weight: 700;

    // ==========================================
    // 2. ANTIGRAVITY GALAXY CANVAS ENGINE
    // ==========================================
    class GalaxyEngine {
      constructor(canvasId) {
        this.canvas = document.getElementById(canvasId);
        if (!this.canvas) return;
        this.ctx = this.canvas.getContext('2d');
        this.stars = [];
        this.orbitNodes = [];
        this.numStars = 800;
        this.warpSpeed = 1.0;
        this.galaxyAngle = 0;
        this.axisTilt = 0.55;
        this.rotationSpeed = 0.002;
        this.antigravityMode = true;
        this.showAxes = true;
        this.mouse = { x: -1000, y: -1000, active: false, radius: 160 };

        this.initCanvas();
        this.generateGalaxy();
        this.bindEvents();
        this.animate = this.animate.bind(this);
        requestAnimationFrame(this.animate);
      }

      initCanvas() {
        this.width = this.canvas.width = window.innerWidth;
        this.height = this.canvas.height = window.innerHeight;
        this.cx = this.width / 2;
        this.cy = this.height / 2;
        this.galaxyRadius = Math.min(this.width, this.height) * 0.45;
      }

      generateGalaxy() {
        this.stars = [];
        const colors = ['#38bdf8', '#818cf8', '#c084fc', '#f472b6', '#34d399', '#fde047', '#ffffff'];
        for (let i = 0; i < this.numStars; i++) {
          const arm = i % 4;
          const armOffset = (arm * 2 * Math.PI) / 4;
          const r = 20 + Math.pow(Math.random(), 1.6) * this.galaxyRadius;
          const spiralAngle = r * 0.015 + armOffset + (Math.random() - 0.5) * 0.6;
          this.stars.push({
            dist: r,
            angle: spiralAngle,
            orbitSpeed: (1 / Math.sqrt(Math.max(r, 40))) * 0.45,
            y: (Math.random() - 0.5) * 60,
            radius: Math.random() * 1.8 + 0.6,
            color: colors[Math.floor(Math.random() * colors.length)],
            axisAngle: Math.random() * Math.PI * 2,
            axisSpeed: (Math.random() * 0.04 + 0.02) * (Math.random() > 0.5 ? 1 : -1),
            axisTilt: (Math.random() - 0.5) * 0.8,
            coronaPulse: Math.random() * Math.PI * 2
          });
        }

        const classColors = ['#38bdf8', '#818cf8', '#a855f7', '#ec4899', '#10b981', '#f59e0b'];
        const classNames = ['শ্রেণি ৬', 'শ্রেণি ৭', 'শ্রেণি ৮', 'শ্রেণি ৯', 'শ্রেণি ১০', 'শ্রেণি ১১'];
        this.orbitNodes = [];
        for (let c = 0; c < 6; c++) {
          this.orbitNodes.push({
            id: c + 6,
            bengali: classNames[c],
            color: classColors[c],
            orbitRadius: 80 + c * 46,
            angle: (c * Math.PI * 2) / 6,
            orbitSpeed: 0.006 - c * 0.0006,
            size: 7 + (c % 2) * 2,
            pulsar: 0
          });
        }
      }

      bindEvents() {
        window.addEventListener('resize', () => this.initCanvas());
        const move = (x, y) => { this.mouse.x = x; this.mouse.y = y; this.mouse.active = true; };
        const leave = () => { this.mouse.active = false; this.mouse.x = -1000; this.mouse.y = -1000; };
        this.canvas.addEventListener('mousemove', (e) => move(e.clientX, e.clientY));
        this.canvas.addEventListener('touchmove', (e) => { if (e.touches.length) move(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
        this.canvas.addEventListener('mouseleave', leave);
        this.canvas.addEventListener('touchend', leave);
      }

      toggleAntigravity() { this.antigravityMode = !this.antigravityMode; return this.antigravityMode; }
      toggleAxes() { this.showAxes = !this.showAxes; return this.showAxes; }
      setWarp(w) { this.warpSpeed = w; }

      animate() {
        this.ctx.fillStyle = 'rgba(5, 8, 22, 0.28)';
        this.ctx.fillRect(0, 0, this.width, this.height);

        // Core Glow
        const grad = this.ctx.createRadialGradient(this.cx, this.cy, 0, this.cx, this.cy, 140);
        grad.addColorStop(0, 'rgba(56, 189, 248, 0.45)');
        grad.addColorStop(0.3, 'rgba(168, 85, 247, 0.25)');
        grad.addColorStop(1, 'rgba(5, 8, 22, 0)');
        this.ctx.fillStyle = grad;
        this.ctx.beginPath();
        this.ctx.arc(this.cx, this.cy, 140, 0, Math.PI * 2);
        this.ctx.fill();

        this.galaxyAngle += this.rotationSpeed * this.warpSpeed;
        const cosG = Math.cos(this.galaxyAngle);
        const sinG = Math.sin(this.galaxyAngle);
        const sinTilt = Math.sin(this.axisTilt);
        const cosTilt = Math.cos(this.axisTilt);

        // Stars
        for (let i = 0; i < this.stars.length; i++) {
          const s = this.stars[i];
          s.angle += s.orbitSpeed * 0.012 * this.warpSpeed;
          s.axisAngle += s.axisSpeed * this.warpSpeed;
          s.coronaPulse += 0.03;

          const baseX = Math.cos(s.angle) * s.dist;
          const baseZ = Math.sin(s.angle) * s.dist;
          const rotX = baseX * cosG - baseZ * sinG;
          const rotZ = baseX * sinG + baseZ * cosG;

          let screenX = this.cx + rotX;
          let screenY = this.cy + (rotZ * sinTilt) + (s.y * cosTilt);

          if (this.mouse.active) {
            const dx = screenX - this.mouse.x;
            const dy = screenY - this.mouse.y;
            const d = Math.sqrt(dx * dx + dy * dy);
            if (d < this.mouse.radius && d > 2) {
              const force = (1 - d / this.mouse.radius) * 20;
              const angle = Math.atan2(dy, dx);
              const mul = this.antigravityMode ? 1.5 : -1.5;
              screenX += Math.cos(angle) * force * mul;
              screenY += Math.sin(angle) * force * mul;
            }
          }

          const starR = Math.max(0.5, s.radius * (1 + Math.sin(s.coronaPulse) * 0.15));
          this.ctx.fillStyle = s.color;
          this.ctx.beginPath();
          this.ctx.arc(screenX, screenY, starR, 0, Math.PI * 2);
          this.ctx.fill();

          if (this.showAxes && s.radius > 1.2 && i % 3 === 0) {
            const aLen = starR * 3.5;
            const vx = Math.cos(s.axisAngle + s.axisTilt) * aLen;
            const vy = Math.sin(s.axisAngle + s.axisTilt) * aLen * 0.5;
            this.ctx.strokeStyle = `${s.color}55`;
            this.ctx.lineWidth = 0.8;
            this.ctx.beginPath();
            this.ctx.moveTo(screenX - vx, screenY - vy);
            this.ctx.lineTo(screenX + vx, screenY + vy);
            this.ctx.stroke();
          }
        }

        // Orbit nodes
        this.orbitNodes.forEach(node => {
          node.angle += node.orbitSpeed * this.warpSpeed;
          node.pulsar += 0.05;
          const sx = this.cx + Math.cos(node.angle) * node.orbitRadius;
          const sy = this.cy + Math.sin(node.angle) * node.orbitRadius * sinTilt;

          this.ctx.fillStyle = node.color;
          this.ctx.globalAlpha = 0.35;
          this.ctx.beginPath();
          this.ctx.arc(sx, sy, (node.size + Math.sin(node.pulsar) * 2) * 1.6, 0, Math.PI * 2);
          this.ctx.fill();

          this.ctx.globalAlpha = 1.0;
          this.ctx.fillStyle = '#ffffff';
          this.ctx.beginPath();
          this.ctx.arc(sx, sy, node.size * 0.6, 0, Math.PI * 2);
          this.ctx.fill();

          this.ctx.fillStyle = '#f8fafc';
          this.ctx.font = '11px "Hind Siliguri", sans-serif';
          this.ctx.textAlign = 'center';
          this.ctx.fillText(node.bengali, sx, sy - 12);
        });

        this.ctx.globalAlpha = 1.0;
        requestAnimationFrame(this.animate);
      }
    }

    // ==========================================
    // 3. WEB AUDIO & SPEECH SYNTHESIS ENGINE
    // ==========================================
    class AudioEngine {
      constructor() {
        this.ctx = null;
        this.soundEnabled = true;
        this.synth = window.speechSynthesis || null;
      }

      initCtx() {
        if (!this.ctx && (window.AudioContext || window.webkitAudioContext)) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
      }

      toggleSound() { this.soundEnabled = !this.soundEnabled; return this.soundEnabled; }

      playClick() {
        if (!this.soundEnabled) return;
        try {
          this.initCtx();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.frequency.setValueAtTime(800, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(400, this.ctx.currentTime + 0.05);
          gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.05);
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.start(); osc.stop(this.ctx.currentTime + 0.05);
        } catch(e) {}
      }

      playCorrect() {
        if (!this.soundEnabled) return;
        try {
          this.initCtx();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.frequency.setValueAtTime(freq, now + i * 0.07);
            gain.gain.setValueAtTime(0.12, now + i * 0.07);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.07 + 0.25);
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.start(now + i * 0.07); osc.stop(now + i * 0.07 + 0.25);
          });
        } catch(e) {}
      }

      playWrong() {
        if (!this.soundEnabled) return;
        try {
          this.initCtx();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.setValueAtTime(140, now + 0.1);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.start(now); osc.stop(now + 0.28);
        } catch(e) {}
      }

      playFanfare() {
        if (!this.soundEnabled) return;
        try {
          this.initCtx();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          [523.25, 659.25, 783.99, 1046.50, 1318.51].forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.frequency.setValueAtTime(freq, now + idx * 0.08);
            gain.gain.setValueAtTime(0.15, now + idx * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.start(now + idx * 0.08); osc.stop(now + 0.8);
          });
        } catch(e) {}
      }

      speakBengali(text, callback) {
        if (!this.synth) return;
        try {
          this.synth.cancel();
          const cleanText = text.replace(/<[^>]*>?/gm, '');
          const ut = new SpeechSynthesisUtterance(cleanText);
          ut.rate = 0.92;
          ut.lang = 'bn-IN';
          ut.onend = () => { if (callback) callback(); };
          ut.onerror = () => { if (callback) callback(); };
          this.synth.speak(ut);
        } catch(e) { if (callback) callback(); }
      }
    }

    function startTimer() {
      stopTimer();
      state.isTimerRunning = true;
      state.isPaused = false;
      state.timerInterval = setInterval(() => {
        if (!state.isPaused) {
          if (state.timeRemaining > 0) {
            state.timeRemaining--;
            renderApp();
          } else {
            stopTimer();
            submitTest();
          }
        }
      }, 1000);
    }

    function stopTimer() {
      if (state.timerInterval) {
        clearInterval(state.timerInterval);
        state.timerInterval = null;
      }
      state.isTimerRunning = false;
    }

    function startMockTest(cls) {
      cls = cls || state.selectedClass || 6;
      state.selectedClass = cls;
      let pool = QUESTION_BANK.filter(q => q.classLevel === cls);
      if (pool.length < 8) {
        const others = QUESTION_BANK.filter(q => q.classLevel !== cls);
        pool = [...pool, ...others];
      }
      state.testQuestions = [...pool].sort(() => 0.5 - Math.random());
      state.currentIndex = 0;
      state.userAnswers = {};
      state.flaggedIds = new Set();
      state.showHint = false;
      state.showExplanation = false;
      state.mode = 'mock';
      state.totalTestTime = state.testQuestions.length * 60;
      state.timeRemaining = state.totalTestTime;
      startTimer();
      state.currentScreen = 'test';
      renderApp();
    }

    function submitTest() {
      stopTimer();
      let correct = 0, wrong = 0, unattempted = 0;
      let secAScore = 0, secATotal = 0, secBScore = 0, secBTotal = 0;

      state.testQuestions.forEach(q => {
        const isA = q.section === 'A';
        if (isA) secATotal++; else secBTotal++;
        const sel = state.userAnswers[q.id];
        if (sel === undefined) unattempted++;
        else if (sel === q.correctAnswer) {
          correct++;
          if (isA) secAScore++; else secBScore++;
        } else wrong++;
      });

      const pct = Math.round((correct / state.testQuestions.length) * 100);
      state.lastResult = {
        date: new Date().toLocaleDateString('bn-IN', { year: 'numeric', month: 'long', day: 'numeric' }),
        classLevel: state.selectedClass,
        totalQuestions: state.testQuestions.length,
        correctCount: correct,
        wrongCount: wrong,
        unattemptedCount: unattempted,
        scorePercentage: pct,
        timeTakenSec: state.totalTestTime - state.timeRemaining,
        sectionAScore: secAScore, sectionATotal: secATotal,
        sectionBScore: secBScore, sectionBTotal: secBTotal
      };

      state.stats.testsCompleted++;
      state.stats.totalScore += pct;
      state.currentScreen = 'result';
      renderApp();
    }

    function getFilteredPYQs() {
      let list = [...QUESTION_BANK];
      if (state.selectedClass !== 'all') list = list.filter(q => q.classLevel === parseInt(state.selectedClass, 10));
      if (state.selectedYear !== 'all') list = list.filter(q => q.year === parseInt(state.selectedYear, 10));
      if (state.selectedCategory !== 'all') list = list.filter(q => q.categoryId === state.selectedCategory);
      if (state.searchQuery.trim()) {
        const qL = state.searchQuery.trim().toLowerCase();
        list = list.filter(q => q.question.toLowerCase().includes(qL) || q.chapter.toLowerCase().includes(qL) || q.explanation.toLowerCase().includes(qL));
      }
      return list;
    }

    function renderTestScreen() {

      const timeFmt = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

      return `
        <div class="test-simulator-viewport container">
          <div class="exam-status-hud">

              <div class="q-box-meta">
                <div class="q-pills">

    // ==========================================
    // 6. EVENT BINDINGS & ORCHESTRATION
    // ==========================================
    let galaxy = null;
    const appEl = document.getElementById('app');

    function renderApp() {
      let body = '';
      if (state.currentScreen === 'galaxy_portal') body = renderGalaxyCoverPage();
      else if (state.currentScreen === 'classes_hub') body = renderClassesHub();
      else if (state.currentScreen === 'pyq_explorer') body = renderPYQExplorer();
      else if (state.currentScreen === 'test') body = renderTestScreen();
      else if (state.currentScreen === 'result') body = renderResultScreen();
      else if (state.currentScreen === 'flashcards') body = renderFlashcardsScreen();
      else if (state.currentScreen === 'scientists') body = renderScientistsScreen();

      appEl.innerHTML = `${renderNavbar()}<main>${body}</main>${renderFooter()}`;
      bindEvents();
    }

    function bindEvents() {
      const navBrand = document.getElementById('nav-brand-logo');
      if (navBrand) navBrand.onclick = () => { audio.playClick(); state.currentScreen = 'galaxy_portal'; renderApp(); };

      const navUser = document.getElementById('nav-user-name');
      if (navUser) navUser.oninput = (e) => { state.userName = e.target.value; };

      const btnSound = document.getElementById('btn-toggle-sound');
      if (btnSound) btnSound.onclick = () => { state.soundMuted = !audio.toggleSound(); renderApp(); };

      const btnTheme = document.getElementById('btn-theme-toggle');
      if (btnTheme) btnTheme.onclick = () => {
        state.theme = state.theme === 'dark' ? 'light' : 'dark';
        document.body.className = `theme-${state.theme}`;
        renderApp();
      };

      document.querySelectorAll('.nav-link').forEach(link => {
        link.onclick = () => {
          audio.playClick();
          const nav = link.getAttribute('data-nav');
          if (nav === 'start_mock') startMockTest(state.selectedClass);
          else { state.currentScreen = nav; renderApp(); }
        };
      });

      // Galaxy Controls
      const btnAntigravity = document.getElementById('btn-toggle-antigravity');
      if (btnAntigravity && galaxy) {
        btnAntigravity.onclick = () => {
          const mode = galaxy.toggleAntigravity();
          state.antigravityMode = mode;
          document.getElementById('hud-gravity-val').textContent = mode ? 'ANTIGRAVITY (বিকর্ষণ)' : 'PULL (আকর্ষণ)';
          btnAntigravity.textContent = `⚡ মোড বদলান (${mode ? 'মহাকর্ষীয় বিকর্ষণ' : 'মহাকর্ষীয় আকর্ষণ'})`;
        };
      }

      const btnWarp = document.getElementById('btn-warp-boost');
      if (btnWarp && galaxy) {
        btnWarp.onclick = () => {
          state.galaxyWarp = state.galaxyWarp >= 3.0 ? 0.8 : Number((state.galaxyWarp + 0.8).toFixed(1));
          galaxy.setWarp(state.galaxyWarp);
          document.getElementById('hud-warp-val').textContent = `${state.galaxyWarp}x SPEED`;
          btnWarp.textContent = `🚀 স্পিড ওয়ার্প বুস্ট (${state.galaxyWarp}x)`;
        };
      }

      const btnAxes = document.getElementById('btn-toggle-star-axes');
      if (btnAxes && galaxy) {
        btnAxes.onclick = () => {
          const ax = galaxy.toggleAxes();
          document.getElementById('hud-axis-val').textContent = ax ? 'ACTIVE (সক্রিয়)' : 'OFF (নিষ্ক্রিয়)';
        };
      }

      document.querySelectorAll('.class-orb-btn').forEach(btn => {
        btn.onclick = () => {
          audio.playClick();
          state.selectedClass = parseInt(btn.getAttribute('data-class'), 10);
          renderApp();
        };
      });

      const btnHeroMock = document.getElementById('btn-hero-mock');
      if (btnHeroMock) btnHeroMock.onclick = () => startMockTest(state.selectedClass);

      const btnHeroPYQ = document.getElementById('btn-hero-pyq');
      if (btnHeroPYQ) btnHeroPYQ.onclick = () => { state.currentScreen = 'pyq_explorer'; renderApp(); };

      const btnHeroFlash = document.getElementById('btn-hero-flashcards');
      if (btnHeroFlash) btnHeroFlash.onclick = () => { state.currentScreen = 'flashcards'; renderApp(); };

      // Classes Hub
      document.querySelectorAll('.btn-class-mock').forEach(b => {
        b.onclick = () => startMockTest(parseInt(b.getAttribute('data-class'), 10));
      });
      document.querySelectorAll('.btn-class-pyq').forEach(b => {
        b.onclick = () => { state.selectedClass = parseInt(b.getAttribute('data-class'), 10); state.currentScreen = 'pyq_explorer'; renderApp(); };
      });

      // PYQ Filter events
      document.querySelectorAll('[data-filter-class]').forEach(b => {
        b.onclick = () => { state.selectedClass = b.getAttribute('data-filter-class'); renderApp(); };
      });
      document.querySelectorAll('[data-filter-year]').forEach(b => {
        b.onclick = () => { state.selectedYear = b.getAttribute('data-filter-year'); renderApp(); };
      });

      const selCat = document.getElementById('select-category-filter');
      if (selCat) selCat.onchange = (e) => { state.selectedCategory = e.target.value; renderApp(); };

      const searchInp = document.getElementById('pyq-search-input');
      if (searchInp) searchInp.oninput = (e) => { state.searchQuery = e.target.value; renderApp(); };

      const btnClear = document.getElementById('btn-clear-search');
      if (btnClear) btnClear.onclick = () => { state.searchQuery = ''; renderApp(); };

      const btnPrint = document.getElementById('btn-print-pyqs');
      if (btnPrint) btnPrint.onclick = () => window.print();

      document.querySelectorAll('.btn-reveal-solution').forEach(b => {
        b.onclick = () => {
          const qid = b.getAttribute('data-qid');
          const d = document.getElementById(`sol-${qid}`);
          if (d) {
            const isH = d.style.display === 'none';
            d.style.display = isH ? 'block' : 'none';
            b.textContent = isH ? '🔼 সমাধান লুকান' : '💡 সঠিক উত্তর ও বিস্তারিত ব্যাখ্যা দেখুন';
          }
        };
      });

      document.querySelectorAll('.btn-audio-speak').forEach(b => {
        b.onclick = () => {
          const txt = decodeURIComponent(b.getAttribute('data-text') || '');
          b.textContent = '🔊 পাঠ হচ্ছে...';
          audio.speakBengali(txt, () => { b.textContent = '🔊 শুনুন'; });
        };
      });

      document.querySelectorAll('.btn-bookmark-star').forEach(b => {
        b.onclick = () => {
          const qid = b.getAttribute('data-qid');
          if (state.bookmarkedIds.has(qid)) state.bookmarkedIds.delete(qid);
          else state.bookmarkedIds.add(qid);
          renderApp();
        };
      });

      // Test Simulator
      document.querySelectorAll('.test-opt-card').forEach(c => {
        c.onclick = () => {
          const optIdx = parseInt(c.getAttribute('data-opt-idx'), 10);
          const q = state.testQuestions[state.currentIndex];
          state.userAnswers[q.id] = optIdx;
          if (optIdx === q.correctAnswer) audio.playCorrect();
          else audio.playWrong();
          renderApp();
        };
      });

      const btnFlag = document.getElementById('btn-flag');
      if (btnFlag) btnFlag.onclick = () => {
        const q = state.testQuestions[state.currentIndex];
        if (state.flaggedIds.has(q.id)) state.flaggedIds.delete(q.id);
        else state.flaggedIds.add(q.id);
        renderApp();
      };

      const btnPrev = document.getElementById('btn-prev-q');
      if (btnPrev) btnPrev.onclick = () => { if (state.currentIndex > 0) { state.currentIndex--; renderApp(); } };

      const btnNext = document.getElementById('btn-next-q');
      if (btnNext) btnNext.onclick = () => { if (state.currentIndex < state.testQuestions.length - 1) { state.currentIndex++; renderApp(); } };

      document.querySelectorAll('.p-btn').forEach(b => {
        b.onclick = () => { state.currentIndex = parseInt(b.getAttribute('data-goto-idx'), 10); renderApp(); };
      });

      const btnPause = document.getElementById('btn-pause-resume');
      if (btnPause) btnPause.onclick = () => { state.isPaused = !state.isPaused; renderApp(); };

      const btnSubmit = document.getElementById('btn-quick-submit');
      if (btnSubmit) btnSubmit.onclick = () => {
        if (confirm('আপনি কি নিশ্চিত যে এই মক টেস্টটি জমা দিতে চান?')) {
          audio.playFanfare();
          submitTest();
        }
      };

      const btnOpenCert = document.getElementById('btn-open-certificate');
      if (btnOpenCert) btnOpenCert.onclick = () => showCertModal();

      const btnRetry = document.getElementById('btn-retry-test');
      if (btnRetry) btnRetry.onclick = () => startMockTest(state.selectedClass);
    }

    function showCertModal() {
      const ex = document.getElementById('cert-modal-backdrop');
      if (ex) ex.remove();
      const div = document.createElement('div');
      div.innerHTML = renderCertificateModal();
      document.body.appendChild(div.firstElementChild);

      const inp = document.getElementById('cert-name-input');
      if (inp) inp.oninput = (e) => { state.userName = e.target.value; };

      const cl = document.getElementById('btn-close-cert');
      if (cl) cl.onclick = () => { const m = document.getElementById('cert-modal-backdrop'); if (m) m.remove(); };
    }

    // Initialize
    window.addEventListener('DOMContentLoaded', () => {
      galaxy = new GalaxyEngine('galaxy-canvas');
      renderApp();
    });
    galaxy = new GalaxyEngine('galaxy-canvas');
    renderApp();
  </script>
</body>
</html>
